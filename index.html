<!doctype html>
<html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0b0f1a"><title>단잠 23 DANJAM 23 | 명동 공식 예약</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@600&family=Noto+Serif+KR:wght@600&display=swap">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable.min.css">
<style>
:root{--bg:#0b0f1a;--s:#131a2b;--g:#c9a45c;--g2:#e6cf9b;--t:#efe6d4;--m:#9aa0ad;--line:rgba(201,164,92,.3);--serif:"Cormorant Garamond","Noto Serif KR",serif}
*{box-sizing:border-box;margin:0}html{scroll-behavior:smooth;scroll-padding-top:110px}
body{background:var(--bg);color:var(--t);font:16px/1.65 "Pretendard Variable",Pretendard,system-ui,sans-serif;overflow-x:hidden;word-break:keep-all}
a{color:inherit;text-decoration:none}:focus-visible{outline:2px solid var(--g2);outline-offset:2px}
header{position:sticky;top:0;z-index:20;display:flex;flex-wrap:wrap;align-items:center;gap:8px 12px;padding:8px 20px;background:rgba(11,15,26,.94);backdrop-filter:blur(8px);border-bottom:1px solid var(--line)}
.logo{font:600 22px var(--serif);letter-spacing:.14em;color:var(--g2);margin-right:auto}
nav{display:flex;gap:22px;font-size:14px;order:0}nav a{padding:10px 0}nav a:hover{color:var(--g2)}
select,input{background:var(--s);color:var(--t);border:1px solid var(--line);border-radius:4px;padding:0 10px;min-height:44px;font:inherit;font-size:14px;width:100%;color-scheme:dark}
header select{width:auto;max-width:150px;min-height:40px;font-size:13px}
.hero{position:relative;display:grid;grid-template-columns:1.3fr .7fr;gap:32px;align-items:center;max-width:1160px;margin:0 auto;padding:64px 24px 130px;min-height:600px}
.sky{position:absolute;inset:0 0 0 0;width:100%;height:100%;z-index:-1}.sky *{transform-box:fill-box}
.glow{animation:on 2.6s ease-out both}.beacon{animation:pulse 2.4s ease-in-out infinite}
@keyframes on{from{opacity:0}to{opacity:1}}@keyframes pulse{50%{opacity:.25}}
.heroWrap{position:relative;overflow:hidden;background:radial-gradient(ellipse at 60% 20%,#1b2744,#0b0f1a 70%)}
h1{font:600 clamp(30px,4.6vw,54px)/1.28 "Noto Serif KR",var(--serif);text-wrap:balance;max-width:16em}
.lead{color:var(--m);margin:18px 0 26px;max-width:46ch}
.badges{display:flex;flex-wrap:wrap;gap:10px}.badges span,.pol span{border:1px solid var(--g);border-radius:999px;padding:7px 14px;font-size:14px;background:rgba(11,15,26,.6)}
.badges span::before{content:"";display:inline-block;width:6px;height:6px;margin-right:9px;background:var(--g);transform:rotate(45deg)}
.frame{justify-self:end;width:min(100%,250px);aspect-ratio:9/14;border:1px solid var(--g);padding:8px;position:relative}
.frame::after{content:"";position:absolute;inset:-10px 10px 10px -10px;border:1px solid var(--line);pointer-events:none}
.slot{height:100%;display:grid;place-content:center;justify-items:center;gap:14px;text-align:center;padding:16px;font-size:13px;color:var(--m);background:radial-gradient(circle at 50% 75%,rgba(201,164,92,.28),transparent 60%),#0f1524}
.slot i{width:0;height:0;border:14px solid transparent;border-left:22px solid var(--g);margin-left:14px}
.bar{max-width:1040px;margin:-64px auto 0;position:relative;z-index:5;background:var(--s);border:1px solid var(--line);padding:16px;display:grid;grid-template-columns:repeat(3,1fr) auto;gap:12px;align-items:end;box-shadow:0 20px 50px rgba(0,0,0,.5)}
label{display:grid;gap:4px;font-size:12px;color:var(--m)}
.btn{background:var(--g);color:#1a1405;border:0;border-radius:4px;font:600 15px inherit;font-family:inherit;padding:0 24px;min-height:48px;cursor:pointer;display:inline-grid;place-items:center}.btn:hover{background:var(--g2)}.btn[aria-disabled=true]{opacity:.35;pointer-events:none}
.ghost{background:none;color:var(--g2);border:1px solid var(--g)}.ghost:hover{background:rgba(201,164,92,.15)}
.pol{max-width:1040px;margin:14px auto 0;padding:0 20px;display:flex;flex-wrap:wrap;gap:8px;font-size:13px;color:var(--m)}.pol span{border-color:var(--line);padding:5px 12px}
section{max-width:1040px;margin:0 auto;padding:72px 20px 8px}
h2{font:600 clamp(24px,3.4vw,34px)/1.3 "Noto Serif KR",var(--serif);color:var(--g2);margin-bottom:8px}.sub{color:var(--m);margin-bottom:24px;max-width:60ch}
.row{display:grid;grid-template-columns:1.1fr 1.5fr 1fr 1.1fr auto;gap:12px;align-items:center;padding:18px 0;border-top:1px solid var(--line)}
.row b{font:600 18px "Noto Serif KR",serif;display:block}.row small{color:var(--m);font-size:13px}
.two{display:grid;grid-template-columns:1fr 1fr;gap:40px}.two h3{font-size:17px;margin-bottom:10px;color:var(--g2)}
ul{list-style:none;padding:0}li{padding:11px 0;border-top:1px solid var(--line)}li b{color:var(--g2);font-weight:600;margin-right:8px}
details{border-top:1px solid var(--line);padding:14px 0}summary{cursor:pointer;font-weight:600;min-height:32px}details p{color:var(--m);margin-top:6px;max-width:64ch}
footer{max-width:1040px;margin:0 auto;padding:64px 20px 40px;display:flex;flex-wrap:wrap;gap:10px;align-items:center}footer a{border:1px solid var(--line);border-radius:4px;padding:11px 16px;font-size:14px;min-height:44px}footer a:hover{border-color:var(--g)}
.fix{display:none;position:fixed;inset:auto 0 0 0;z-index:30;gap:10px;align-items:center;padding:10px 16px calc(10px + env(safe-area-inset-bottom));background:rgba(11,15,26,.97);border-top:1px solid var(--g)}.fix div{margin-right:auto;font-size:12px;color:var(--m)}.fix strong{display:block;font-size:17px;color:var(--g2)}
#toast{position:fixed;left:50%;bottom:96px;translate:-50% 0;background:var(--g);color:#1a1405;padding:10px 16px;border-radius:4px;font-size:14px;opacity:0;pointer-events:none;transition:opacity .2s;z-index:40;max-width:90vw}#toast.on{opacity:1}
@media(max-width:760px){.hero{grid-template-columns:1fr;padding-top:36px}.frame{justify-self:start;max-width:200px}.bar{grid-template-columns:1fr 1fr;margin-inline:12px}.bar .btn{grid-column:1/-1}.row{grid-template-columns:1fr 1fr}.two{grid-template-columns:1fr}nav{order:5;width:100%;justify-content:space-between;overflow-x:auto;gap:14px}.fix{display:flex}body{padding-bottom:84px}}
@media(prefers-reduced-motion:reduce){*{animation:none!important;scroll-behavior:auto!important}}
</style></head><body>
<header><a class="logo" href="#about" translate="no">DANJAM 23</a>
<nav aria-label="주요 메뉴"><a href="#about" data-n="0">소개</a><a href="#rooms" data-n="1">객실</a><a href="#book" data-n="2">예약</a><a href="#map" data-n="3">오시는 길</a><a href="#guide" data-n="4">이용안내</a></nav>
<select id="lang" aria-label="언어 선택 Language"></select>
<select id="cur" aria-label="통화 선택 Currency"></select></header>
<main>
<div class="heroWrap"><svg class="sky" viewBox="0 0 1200 600" preserveAspectRatio="xMidYMax slice" aria-hidden="true">
<defs><radialGradient id="gl"><stop offset="0" stop-color="#e6cf9b" stop-opacity=".45"/><stop offset="1" stop-color="#e6cf9b" stop-opacity="0"/></radialGradient></defs>
<g id="st" fill="#efe6d4"></g><circle class="glow" cx="700" cy="300" r="230" fill="url(#gl)"/>
<g class="glow" fill="#e6cf9b"><polygon points="694,440 706,440 704,300 696,300"/><rect x="681" y="278" width="38" height="18" rx="5"/><rect x="691" y="262" width="18" height="14"/><rect x="699" y="200" width="2" height="62"/><circle class="beacon" cx="700" cy="198" r="4" fill="#ff8a5c"/></g>
<path d="M0 600V480Q220 440 420 490T760 440Q900 420 1030 455T1200 470V600Z" fill="#070a12"/><g id="lt" class="glow"></g></svg>
<div class="hero" id="about"><div><h1 data-i="0">남산이 창가에 켜지는 밤, 명동의 단잠</h1>
<p class="lead">명동 도보 5분, 남산뷰 객실. 공식 홈페이지에서 예약하면 아래 혜택이 모두 포함됩니다.</p>
<div class="badges"><span data-i="1">공식 최저가 보장</span><span data-i="2">레이트 체크아웃 1시간 무료</span><span data-i="3">무료 짐보관</span></div></div>
<div class="frame"><!-- 영상 교체: <video src poster autoplay muted loop playsinline> (첫 프레임 poster 필수) -->
<div class="slot"><i></i><span>12초 남산뷰 홍보영상<br>보정 실사 슬롯</span></div></div></div></div>
<form class="bar" id="book" onsubmit="return false"><label>체크인 Check-in<input type="date" id="ci"></label><label>체크아웃 Check-out<input type="date" id="co"></label
