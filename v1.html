<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#23211F"><title>단잠 23 DANJAM 23</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700&family=Noto+Serif+KR:wght@600&display=swap" rel="stylesheet">
<style>
:root{--ink:#23211F;--cream:#EFE6D6;--paper:#F7F1E5;--jade:#8FB5A5}
*{box-sizing:border-box;margin:0}html{scroll-behavior:smooth}
body{font:400 16px/1.6 "Noto Sans KR","Noto Sans JP","Noto Sans SC",sans-serif;background:var(--cream);color:var(--ink);word-break:keep-all;overflow-x:hidden;padding-bottom:calc(76px + env(safe-area-inset-bottom))}
a,button,select,input{font:inherit;color:inherit}button,a{cursor:pointer}
:focus-visible{outline:2px solid var(--jade);outline-offset:3px}
.hero{position:relative;min-height:88vh;padding:0 6vw 120px;color:var(--cream);background:linear-gradient(180deg,#1d1b19 0%,var(--ink) 42%,#6b5f52 70%,var(--cream) 100%);overflow:hidden}
header{position:relative;z-index:2;display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:8px 16px;padding:18px 0}
.logo{font:600 22px "Noto Serif KR",serif;letter-spacing:.04em;text-decoration:none}
.tools{display:flex;gap:6px;align-items:center}
.tools button,.tools select{min-height:44px;min-width:44px;padding:0 10px;border:1px solid #efe6d655;border-radius:999px;background:none;font-size:14px;color:var(--cream)}
.tools button[aria-pressed=true]{background:var(--cream);color:var(--ink)}.tools option{color:var(--ink)}
nav{display:flex;gap:4px 28px;width:100%;overflow-x:auto}
nav a{min-height:44px;display:flex;align-items:center;white-space:nowrap;color:var(--cream);text-decoration:none;opacity:.85}nav a:hover{opacity:1;text-decoration:underline;text-underline-offset:6px}
h1{position:relative;z-index:2;max-width:11em;margin-top:9vh;font:600 clamp(36px,6.4vw,76px)/1.2 "Noto Serif KR",serif;text-wrap:balance}
.sub{position:relative;z-index:2;max-width:26em;margin-top:20px;opacity:.85}
.tower{position:absolute;right:7vw;bottom:0;height:86%;max-height:640px;z-index:1}
.bc{animation:pulse 3s ease-in-out infinite;transform-origin:100px 38px}
@keyframes pulse{50%{opacity:.25;transform:scale(2.4)}}
.ph{position:absolute;left:6vw;bottom:96px;z-index:2;padding:10px 14px;border:1.5px dashed var(--ink);border-radius:6px;font-size:14px;color:var(--ink)}
.bar{position:relative;z-index:3;display:grid;grid-template-columns:repeat(3,1fr) auto;gap:12px;align-items:end;width:min(1000px,92vw);margin:-52px auto 0;padding:20px 24px;background:var(--ink);color:var(--cream);border-radius:10px}
.bar label{display:grid;gap:4px;font-size:14px;opacity:.9}
.bar input,.bar select{min-height:48px;padding:0 12px;border:1px solid #efe6d655;border-radius:6px;background:#2e2b28;color:var(--cream);color-scheme:dark}
.go{min-height:48px;padding:0 28px;border:0;border-radius:6px;background:var(--jade);color:var(--ink);font-weight:700}.go:hover{background:#a8cbbc}
section{width:min(1000px,92vw);margin:72px auto 0}
h2{font:600 clamp(24px,3vw,34px)/1.3 "Noto Serif KR",serif;margin-bottom:24px}
.rooms{display:grid;grid-template-columns:repeat(3,1fr);list-style:none;padding:0;border-top:2px solid var(--ink)}
.rooms li{padding:24px 24px 24px 0;border-bottom:1px solid #23211f40}.rooms li+li{padding-left:24px;border-left:1px solid #23211f40}
.rooms h3{font:600 22px "Noto Serif KR",serif}.rooms p{margin:4px 0 20px;font-size:15px;opacity:.75}
.price{font:700 28px/1.2 "Noto Sans KR",sans-serif;font-variant-numeric:tabular-nums}.price small{font:400 14px "Noto Sans KR";opacity:.7}
.tot{font-size:14px;margin-top:4px;opacity:.75;font-variant-numeric:tabular-nums}
.msg{display:flex;flex-wrap:wrap;gap:10px}
.msg a{min-height:48px;display:flex;align-items:center;padding:0 22px;border:1.5px solid var(--ink);border-radius:999px;text-decoration:none;font-weight:500}.msg a:hover{background:var(--ink);color:var(--cream)}
.mbar{position:fixed;inset:auto 0 0;z-index:9;display:none;align-items:center;justify-content:space-between;padding:10px 16px calc(10px + env(safe-area-inset-bottom));background:var(--ink);color:var(--cream)}
.mbar b{font-size:20px;font-variant-numeric:tabular-nums}.mbar .go{min-width:140px;text-decoration:none;display:grid;place-items:center}
@media(max-width:760px){.bar{grid-template-columns:1fr 1fr;margin-top:-40px}.bar label:nth-child(3),.go[type=submit]{grid-column:1/-1}.tower{height:52%;opacity:.8}.ph{bottom:80px}
.rooms{grid-template-columns:1fr}.rooms li+li{padding-left:0;border-left:0}.mbar{display:flex}}
@media(prefers-reduced-motion:reduce){.bc{animation:none}html{scroll-behavior:auto}}
</style></head><body>
<div class="hero">
<header><a class="logo" href="#" translate="no">단잠 23 DANJAM 23</a>
<div class="tools"><span id="lg"></span><select id="cur" aria-label="Currency"><option>KRW</option><option>USD</option><option>JPY</option><option>CNY</option></select></div>
<nav><a href="#" data-i="n1"></a><a href="#rooms" data-i="n2"></a><a href="#bar" data-i="n3"></a><a href="#map" data-i="n4"></a><a href="#guide" data-i="n5"></a></nav></header>
<h1 data-i="h1"></h1><p class="sub" data-i="sub"></p>
<svg class="tower" viewBox="0 0 200 420" aria-hidden="true"><defs><linearGradient id="g" gradientUnits="userSpaceOnUse" x1="0" y1="0" x2="0" y2="420"><stop offset="0" stop-color="#EFE6D6"/><stop offset=".55" stop-color="#EFE6D6"/><stop offset=".85" stop-color="#23211F"/></linearGradient></defs>
<circle cx="30" cy="70" r="14" fill="#EFE6D6" opacity=".18"/><path d="M0 420V385Q100 335 200 385V420Z" fill="#23211F"/>
<path d="M92 372L97 170h6l5 202z M80 160h40l-6 22H86z M99 160V42h2v118z" fill="url(#g)"/><circle class="bc" cx="100" cy="38" r="4" fill="#8FB5A5"/></svg>
<div class="ph" data-i="ph"></div></div>
<form class="bar" id="bar"><label><span data-i="ci"></span><input type="date" id="ci" required></label><label><span data-i="co"></span><input type="date" id="co" required></label>
<label><span data-i="gu"></span><select id="gu"></select></label><button class="go" type="submit" data-i="go"></button></form>
<section id="rooms"><h2 data-i="rt"></h2><ul class="rooms" id="rl"></ul></section>
<section id="msgs"><h2 data-i="mt"></h2><div class="msg"><a href="#">KakaoTalk</a><a href="#">WhatsApp</a><a href="#">LINE</a><a href="#">WeChat</a></div></section>
<div class="mbar"><div><small data-i="from"></small><br><b id="mp"></b></div><a class="go" href="#bar" data-i="book"></a></div>
<script>
const T={n1:["소개","About","紹介","关于我们"],n2:["객실","Rooms","客室","客房"],n3:["예약","Book","予約","预订"],n4:["오시는 길","Getting here","アクセス","交通指南"],n5:["여행 정보","Travel guide","旅行情報","旅游信息"],
h1:["남산타워가 보이는 방에서, 단잠","Sleep deeply in view of Namsan Tower","南山タワーを望む部屋で、ぐっすり","在南山塔下的房间，安稳入睡"],
sub:["명동 한복판, 외국인 전용 부티크 호스텔. 공식 홈페이지 예약이 가장 저렴합니다.","A boutique hostel for international guests in the heart of Myeongdong. Book direct for the lowest rate.","明洞の中心にある外国人専用ブティックホステル。公式サイト予約が最安値です。","位于明洞中心的外国游客专属精品旅舍。官网直订价格最低。"],
ph:["12초 홍보영상 / 실사 영역","12-sec promo video / photo area","12秒プロモ映像 / 写真エリア","12秒宣传片 / 实拍区域"],
ci:["체크인","Check-in","チェックイン","入住"],co:["체크아웃","Check-out","チェックアウト","退房"],gu:["인원","Guests","人数","人数"],go:["객실 검색","Search rooms","客室を検索","搜索客房"],
rt:["객실 최저가","Lowest rates by room","客室の最安値","客房最低价"],mt:["메신저로 문의","Message us","メッセージで問い合わせ","即时通讯咨询"],from:["최저가 / 1박","From / night","最安値 / 1泊","最低价 / 晚"],book:["예약하기","Book now","予約する","立即预订"],
tw:["트윈룸","Twin room","ツインルーム","双床房"],db:["더블룸","Double room","ダブルルーム","大床房"],sg:["싱글룸","Single room","シングルルーム","单人房"],
nt:["1박","per night","1泊","每晚"],tot:["총","Total for","合計","共"]};
const R=[["tw",85000,2],["db",78000,2],["sg",55000,1]],FX={KRW:1,USD:.00072,JPY:.108,CNY:.0052},LOC=["ko-KR","en-US","ja-JP","zh-CN"],LN=["KO","EN","JP","CN"],DC=["KRW","USD","JPY","CNY"];
const $=s=>document.querySelector(s);let L=0;
const day=n=>{const d=new Date();d.setDate(d.getDate()+n);return d.toISOString().slice(0,10)};
const nights=()=>Math.max(1,Math.round((new Date($("#co").value)-new Date($("#ci").value))/864e5)||1);
const money=v=>{const c=$("#cur").value;return new Intl.NumberFormat(LOC[L],{style:"currency",currency:c,maximumFractionDigits:0}).format(v*FX[c])};
const gl=n=>[n+"명",n+(n>1?" guests":" guest"),n+"名",n+"位"][L];
function render(){document.documentElement.lang=["ko","en","ja","zh"][L];
 document.querySelectorAll("[data-i]").forEach(e=>e.textContent=T[e.dataset.i][L]);
 $("#lg").innerHTML=LN.map((n,i)=>`<button type="button" aria-pressed="${i==L}" data-l="${i}">${n}</button>`).join("");
 const g=$("#gu"),v=g.value||2;g.innerHTML=[1,2,3,4].map(n=>`<option value="${n}">${gl(n)}</option>`).join("");g.value=v;
 const n=nights(),N=+g.value;
 $("#rl").innerHTML=R.map(([k,p,c])=>`<li><h3>${T[k][L]}</h3><p>${gl(c)}</p><div class="price">${money(p)} <small>${T.nt[L]}</small></div>${N>c?"":`<div class="tot">${T.tot[L]} ${n}${["박"," nights","泊","晚"][L]}: ${money(p*n)}</div>`}</li>`).join("");
 $("#mp").textContent=money(Math.min(...R.map(r=>r[1])))}
$("#lg").onclick=e=>{const b=e.target.closest("[data-l]");if(b){L=+b.dataset.l;$("#cur").value=DC[L];render()}};
$("#cur").onchange=render;$("#gu").onchange=render;
$("#ci").min=day(0);$("#ci").value=day(1);$("#co").value=day(3);
$("#ci").onchange=()=>{if($("#co").value<=$("#ci").value)$("#co").value=new Date(+new Date($("#ci").value)+864e5).toISOString().slice(0,10);$("#co").min=$("#ci").value;render()};
$("#co").onchange=render;
$("#bar").onsubmit=e=>{e.preventDefault();render();$("#rooms").scrollIntoView({behavior:"smooth"})};
render();
</script></body></html>
